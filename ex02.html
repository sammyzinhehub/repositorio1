<body>
    <h1>Eventos DOM</h1>
    <div> id="area" onclick="clicar()"interaja</div>
    <P>Eventos DOM; moseenter; mouseout; mousemove; mousep; mousedown; click
    </P>
    <script>
        function clicar (){
            var a = document.getElementById('area')
            a.innerText = 'clicou' 
        }
        function entrou(){
            var a = document.getElementById('area')
            a.innerText = 'entrou'
            a.style.background= 'black'
        }
        function saiu(){
            var a = document.querySelector('div#area')
            a.innerText = 'saiu'
            a.style.background= 'aquamarine'
        }

    </script> 
</body>
</html>
