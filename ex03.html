<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparar eventos com Listener</title>
    <style>
        body {
            background-color:bisque;
        }
        div#area{
            background: rgb(114, 183, 228);
            color: rgb(250, 252, 252);
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            font-size: 20pt;
            font-family: Arial, Helvetica, sans-serif;
      
        }
    </style>
</head>
<body>
    <h1>Disparar eventos com Listener</h1>
    <p> Alem de disparar eventos dentro do HTML, podemos disparar utilizando listener dentro do JS.</p>
    <div id="area">interaja</div>
    <script>
       var a = document.querySelector("div#area");
        a.addEventListener('click', clicar);
        a.addEventListener('mouseenter', entrar);
        a.addEventListener('mouseenter', sair)
        function clicar () {
            a.innerHTML = 'clicou'
            a.style.backgroud='purple'   
        }
        function entrar() {
            a.innerHTML='entrou'
            a.style.backgroud='blue'
        }
        function sair () {
            a.innerHTML='sair'
            a.style.backgroud='red'
        }
    </script>
</body>
</html>
